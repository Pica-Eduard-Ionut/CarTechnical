name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-user-service:
    runs-on: ubuntu-latest
    name: Test UserService
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: userservice
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable (UserService)
        working-directory: ./Services working together/UserService
        run: chmod +x mvnw || true

      - name: Wait for MariaDB
        run: |
          for i in {1..60}; do
            nc -z 127.0.0.1 3306 && echo "DB ready" && exit 0
            sleep 2
          done
          echo "DB not ready in time" && exit 1

      - name: Run tests
        working-directory: ./Services working together/UserService
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/userservice
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          if [ -x ./mvnw ]; then ./mvnw -B -ntp test -DfailIfNoTests=false; else mvn -B -ntp test -DfailIfNoTests=false; fi

      - name: Generate test report
        if: ${{ always() && hashFiles('Services working together/UserService/target/surefire-reports/*.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: UserService Tests
          path: Services working together/UserService/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  test-request-service:
    runs-on: ubuntu-latest
    name: Test RequestService
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: requestservice
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable (RequestService)
        working-directory: ./Services working together/RequestService
        run: chmod +x mvnw || true

      - name: Wait for MariaDB
        run: |
          for i in {1..60}; do
            nc -z 127.0.0.1 3306 && echo "DB ready" && exit 0
            sleep 2
          done
          echo "DB not ready in time" && exit 1

      - name: Run tests
        working-directory: ./Services working together/RequestService
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/requestservice
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          if [ -x ./mvnw ]; then ./mvnw -B -ntp test -DfailIfNoTests=false; else mvn -B -ntp test -DfailIfNoTests=false; fi

      - name: Generate test report
        if: ${{ always() && hashFiles('Services working together/RequestService/target/surefire-reports/*.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: RequestService Tests
          path: Services working together/RequestService/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  test-notification-service:
    runs-on: ubuntu-latest
    name: Test NotificationService
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./Services working together/NotificationService
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests (skip SMTP script)
        working-directory: ./Services working together/NotificationService
        run: |
          pytest -q -k "not smtp" --cov=. --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./Services working together/NotificationService/coverage.xml
          flags: notification-service
          fail_ci_if_error: false

  build-and-push:
    needs: [test-user-service, test-request-service, test-notification-service]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: user-service
            context: ./Services working together/UserService
            dockerfile: ./Services working together/UserService/Dockerfile
          - name: request-service
            context: ./Services working together/RequestService
            dockerfile: ./Services working together/RequestService/Dockerfile
          - name: notification-service
            context: ./Services working together/NotificationService
            dockerfile: ./Services working together/NotificationService/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:buildcache,mode=max


