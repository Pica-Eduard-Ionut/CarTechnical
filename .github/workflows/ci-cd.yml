name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-user-service:
    runs-on: ubuntu-latest
    name: Test UserService
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./Services working together/UserService
        run: ./mvnw -B -ntp test

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: UserService Tests
          path: Services working together/UserService/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  test-request-service:
    runs-on: ubuntu-latest
    name: Test RequestService
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./Services working together/RequestService
        run: ./mvnw -B -ntp test

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: RequestService Tests
          path: Services working together/RequestService/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  test-notification-service:
    runs-on: ubuntu-latest
    name: Test NotificationService
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./Services working together/NotificationService
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests (skip SMTP script)
        working-directory: ./Services working together/NotificationService
        run: |
          pytest -q -k "not smtp" --cov=. --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./Services working together/NotificationService/coverage.xml
          flags: notification-service
          fail_ci_if_error: false

  build-and-push:
    needs: [test-user-service, test-request-service, test-notification-service]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: user-service
            context: ./Services working together/UserService
            dockerfile: ./Services working together/UserService/Dockerfile
          - name: request-service
            context: ./Services working together/RequestService
            dockerfile: ./Services working together/RequestService/Dockerfile
          - name: notification-service
            context: ./Services working together/NotificationService
            dockerfile: ./Services working together/NotificationService/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /path/to/project
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
