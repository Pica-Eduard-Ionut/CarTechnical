<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>My Vehicles</title>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<h2>My Vehicles</h2>
<a href="/vehicles/create">+ Add New Vehicle</a>

<table border="1">
    <thead>
    <tr>
        <th>Make</th>
        <th>Model</th>
        <th>Year</th>
        <th>VIN</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${vehicles}">
        <td th:text="${v.make}"></td>
        <td th:text="${v.model}"></td>
        <td th:text="${v.year}"></td>
        <td th:text="${v.vin}"></td>
        <td>
            <a th:href="@{'/vehicles/view/' + ${v.id}}">View</a> |
            <a th:href="@{'/vehicles/edit/' + ${v.id}}">Edit</a> |
            <form th:action="@{'/vehicles/delete/' + ${v.id}}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
