<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Admin Dashboard</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h2>Admin Dashboard</h2>

<ul>
    <li>Total Requests: <span th:text="${stats.totalRequests}"></span></li>
    <li>Pending: <span th:text="${stats.pendingCount}"></span></li>
    <li>Completed: <span th:text="${stats.completedCount}"></span></li>
    <li>Top Service Type: <span th:text="${stats.topServiceType}"></span></li>
</ul>

<form th:action="@{/admin/strategy}" method="post">
    <button type="submit" name="type" value="priority">Use Priority-Based Scheduling</button>
    <button type="submit" name="type" value="earliest">Use Earliest Available Scheduling</button>
</form>

<p><a th:href="@{/requests/next}">View Next Scheduled Request</a></p>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
